<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you</title>
<style>
:root{--bg:#fbf6f0;--card:#fff;--ink:#3a2f35;--soft:#8a7a82;--accent:#d4688a;--accent2:#7a9a7e;--line:#f0dde4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d171b;--card:#2a2227;--ink:#f6ebef;--soft:#b8a4ac;--accent:#ee8fae;--accent2:#9dbba0;--line:#40343b}}
:root[data-theme="dark"]{--bg:#1d171b;--card:#2a2227;--ink:#f6ebef;--soft:#b8a4ac;--accent:#ee8fae;--accent2:#9dbba0;--line:#40343b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh;display:flex;justify-content:center}
.screen{display:none;width:100%;max-width:440px;padding:32px 22px;min-height:100vh;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;animation:in .6s ease}
.screen.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:2rem;line-height:1.2;margin:0;font-weight:normal}
h2{font-size:1.4rem;margin:0;font-weight:normal}
p{margin:0;line-height:1.6}
.sub{color:var(--soft);font-style:italic}
button{font-family:inherit;cursor:pointer;border:0;border-radius:999px;padding:13px 26px;font-size:1rem;background:var(--accent);color:#fff;transition:transform .15s}
button:active{transform:scale(.96)}
button.ghost{background:transparent;color:var(--soft);border:1px solid var(--line)}
.lily{width:84px;height:84px;color:var(--accent)}
.opt{display:block;width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;margin-bottom:10px;font-size:.98rem}
.opt.pick{border-color:var(--accent);background:var(--line)}
.opt input{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;outline:0}
.reply{background:var(--card);border-left:3px solid var(--accent2);border-radius:10px;padding:12px 14px;text-align:left;min-height:3.2em;width:100%}
.bar{font-size:.8rem;color:var(--soft)}
#yes{transition:all .25s;max-width:100%}
.coupon{width:100%;background:var(--card);border:2px dashed var(--accent);border-radius:18px;padding:24px 18px;position:relative}
.coupon .big{font-size:1.5rem;color:var(--accent);margin:8px 0}
.coupon small{display:block;color:var(--soft);margin-top:10px;font-size:.78rem}
.letter{background:var(--card);border-radius:18px;padding:24px 20px;text-align:left;box-shadow:0 6px 24px rgba(0,0,0,.07);width:100%}
.letter p+p{margin-top:12px}
.fade{opacity:0;transition:opacity 1.2s}.fade.s{opacity:1}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="l" viewBox="-50 -50 100 100"><g fill="currentColor"><ellipse cx="0" cy="-22" rx="9" ry="26"/><ellipse cx="0" cy="-22" rx="9" ry="26" transform="rotate(60)"/><ellipse cx="0" cy="-22" rx="9" ry="26" transform="rotate(120)"/><ellipse cx="0" cy="-22" rx="9" ry="26" transform="rotate(180)" opacity=".7"/><ellipse cx="0" cy="-22" rx="9" ry="26" transform="rotate(240)" opacity=".7"/><ellipse cx="0" cy="-22" rx="9" ry="26" transform="rotate(300)" opacity=".7"/></g><g stroke="#c9a24a" stroke-width="2" stroke-linecap="round"><path d="M0 0v-14M0 0l12-7M0 0l-12-7"/></g></symbol></svg>

<!-- 1 -->
<section class="screen on" id="s1">
<svg class="lily"><use href="#l"/></svg>
<h1>i know you’re upset</h1>
<p id="a" class="fade sub">even though you deny it</p>
<button id="go1" class="fade" onclick="go(2)">…okay, fair</button>
</section>

<!-- 2 quiz -->
<section class="screen" id="s2">
<div class="bar" id="qn"></div>
<h2 id="q"></h2>
<div id="opts" style="width:100%"></div>
<div class="reply" id="r" style="display:none"></div>
<button id="nx" style="display:none" onclick="nextQ()">next</button>
</section>

<!-- 3 forgive -->
<section class="screen" id="s3">
<svg class="lily" style="width:64px;height:64px"><use href="#l"/></svg>
<h1>so… do you forgive me?</h1>
<p class="sub" id="hint">please? 🥺</p>
<div style="display:flex;flex-direction:column;align-items:center;gap:14px;width:100%">
<button id="yes" onclick="go(4)" style="font-size:18px">Yes 💗</button>
<button id="no" class="ghost" onclick="noPress()">No</button>
</div>
</section>

<!-- 4 comp -->
<section class="screen" id="s4">
<h2>ok. how do I make it up to you?</h2>
<p class="sub">pick one. no take-backs.</p>
<div style="width:100%">
<button class="opt" onclick="pick(this,'Momos on me in December')">momos on me in december</button>
<button class="opt" onclick="pick(this,'Your choice of movie, on me')">your choice of movie on me</button>
<button class="opt" onclick="pick(this,'One late night call, I stay awake the WHOLE time')">late night call (I stay awake. promise.)</button>
<div class="opt" id="own"><input id="ownin" placeholder="or choose your own…" oninput="pick(this.parentNode,this.value.trim())"></div>
</div>
<button id="cbtn" style="display:none" onclick="coupon()">get my coupon</button>
</section>

<!-- 5 coupon -->
<section class="screen" id="s5">
<div class="coupon">
<svg class="lily" style="width:54px;height:54px"><use href="#l"/></svg>
<div class="bar">OFFICIAL APOLOGY COUPON</div>
<div class="bar">for: <b id="cn"></b></div>
<div class="big" id="cw"></div>
<div class="bar">from: <b id="cm"></b> · valid forever · no expiry</div>
<small>screenshot this and send it to me to redeem</small>
</div>
<button onclick="go(6)">one last thing →</button>
</section>

<!-- 6 letter -->
<section class="screen" id="s6">
<svg class="lily"><use href="#l"/></svg>
<div class="letter" id="letter"></div>
</section>

<script>
// ✏️ EDIT THESE
var HER="mazmallow", ME="me";
var LETTER=[
"i’m really sorry for leaving you in the middle of it. i know you get anxious too, and i should have been more aware.",
"nonetheless i promise i’ll do my best so this doesn’t happen again.",
"last night was really fun, the call, the staying up, and i would give anything to prove that it means a lot to me.",
"you’re my forever bestie dude and when ur here life’s pretty good. i know i mess up sometimes, i’ll do whatever it takes to manofy you though.",
"so yeah. i’m sorry, "+HER+". you’re stuck with me, and i’m not going anywhere."
];
var QS=[
{q:"Valid reasons for me to fall asleep mid-conversation with you?",o:[
["My bed has a strong gravitational pull","Science is not an excuse. Noted, though. It IS strong."],
["None. There are no valid reasons.","Correct. I accept the verdict 😭"]]},
{q:"What should I have done instead?",o:[
["Stayed awake with toothpicks in my eyelids","Dedication. Painful, but you would’ve deserved it 🥺"],
["Said “give me 5 min” before dozing","Even a small heads-up would’ve saved the night. Fair."]]},
{q:"On a scale of 1 to 10, how guilty am I?",slider:1}
];
var qi=0,n=0;
function go(i){document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("on")});document.getElementById("s"+i).classList.add("on");window.scrollTo(0,0);if(i==2)showQ();if(i==6)letter()}
setTimeout(function(){a.classList.add("s")},900);
setTimeout(function(){go1.classList.add("s")},2200);
function showQ(){var x=QS[qi];qn.textContent="question "+(qi+1)+" of "+QS.length;q.textContent=x.q;r.style.display="none";nx.style.display="none";opts.innerHTML="";if(x.slider){sliderUI();return}
x.o.forEach(function(o){var b=document.createElement("button");b.className="opt";b.textContent=o[0];b.onclick=function(){r.textContent=o[1];r.style.display="block";nx.style.display="inline-block";nx.textContent=qi==QS.length-1?"fine, I’m guilty →":"next";opts.querySelectorAll(".opt").forEach(function(e){e.classList.remove("pick")});b.classList.add("pick")};opts.appendChild(b)})}
function sliderUI(){
opts.innerHTML='<div id="sc" style="font-size:2rem;color:var(--accent);margin:6px 0">0 / 10</div><input type="range" id="sl" min="0" max="100" value="0" style="width:100%;accent-color:var(--accent)">';
var s=document.getElementById("sl"),sc=document.getElementById("sc");
s.oninput=function(){var v=+s.value,t,m;
if(v<=50){t=Math.round(v/5)+" / 10"}else if(v<100){t=Math.round(10*Math.pow(2,(v-50)/5)).toLocaleString()+" / 10"}else{t="∞ / 10"}
m=v<=15?"you’re being too nice. be honest.":v<=50?"getting warmer. keep going.":v<70?"that’s 10 and you’re STILL going. okay.":v<90?"the scale is cracking.":v<100?"the scale is begging you to stop 😭":"the scale has broken. I’m guilty beyond measurement.";
sc.textContent=t;sc.style.fontSize=(2+Math.max(0,v-50)*0.04)+"rem";sc.style.animation=v>=90?"shake .3s infinite":"none";
r.textContent=m;r.style.display="block";nx.style.display="inline-block";nx.textContent="fine, I’m guilty →"};}
function nextQ(){qi++;if(qi>=QS.length)go(3);else showQ()}
var hints=["please? 🥺","pretty please?","come on…","you’re making Yes look very good…","last chance, No is leaving…"];
function noPress(){n++;var y=document.getElementById("yes");y.style.fontSize=(18+n*10)+"px";y.style.padding=(13+n*7)+"px "+(26+n*10)+"px";hint.textContent=hints[Math.min(n,4)];
if(n>=5){no.style.display="none";hint.textContent="No has left the chat. 💗";y.style.width="100%"}}
var choice="";
function pick(el,t){document.querySelectorAll("#s4 .opt").forEach(function(e){e.classList.remove("pick")});el.classList.add("pick");choice=t;cbtn.style.display=t?"inline-block":"none"}
function coupon(){cn.textContent=HER;cm.textContent=ME;cw.textContent=choice;go(5)}
function letter(){letter_.innerHTML="";}
var letter_=document.getElementById("letter");
letter=function(){letter_.innerHTML="<h2 style='margin-bottom:14px'>hey "+HER+",</h2>"+LETTER.map(function(p){return"<p>"+p+"</p>"}).join("")};
</script>
</body>
</html>
